mixed-port: 7890
allow-lan: false
mode: global
log-level: debug

proxies:
  - name: enc-socks
    type: encrypted-socks5
    server: 127.0.0.1
    port: 1081
    password: demo-secret
    udp: true

proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - enc-socks

rules:
  - MATCH,GLOBAL
